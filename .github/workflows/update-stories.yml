name: Update Latest Stories

on:
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    if: github.repository_owner == 'arverma'
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      
      - name: Run update script
        run: |
          chmod +x scripts/update-latest-stories.py
          python3 scripts/update-latest-stories.py
      
      - name: Check for changes
        id: check
        run: |
          if git diff --quiet index.html; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No changes to commit"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Changes detected"
          fi
      
      - name: Commit and push
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "chore: update latest stories from Medium RSS feed [skip ci]"
          git push
      
      - name: Notify IndexNow
        if: steps.check.outputs.changed == 'true'
        run: |
          curl -X POST 'https://api.indexnow.org/indexnow' \
            -H 'Content-Type: application/json' \
            -d '{
              "host": "tde.arverma.dev",
              "key": "46ea86a7ca2b9ab5e74e4e8c96b04d10",
              "keyLocation": "https://tde.arverma.dev/46ea86a7ca2b9ab5e74e4e8c96b04d10.txt",
              "urlList": ["https://tde.arverma.dev/"]
            }' || echo "IndexNow notification failed (non-fatal)"
