name: Update Latest Stories

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Weekly rebuild so Latest Stories (read from Medium at update time) stays fresh.
    # Matches arverma.dev deploy schedule (Mondays at 3 AM UTC).
    - cron: "0 3 * * 1"

permissions:
  contents: write
  pages: write

jobs:
  update:
    runs-on: ubuntu-latest
    if: github.repository_owner == 'arverma'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Fetch latest stories from Medium RSS
        run: |
          chmod +x scripts/update-latest-stories.py
          python3 scripts/update-latest-stories.py

      - name: Check for changes
        id: check
        run: |
          if git diff --quiet index.html; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No changes to commit"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Changes detected"
          fi

      - name: Commit and push
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "chore: update latest stories from Medium RSS"
          git push

      - name: Request Pages build
        if: steps.check.outputs.changed == 'true'
        run: |
          curl -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds" \
            || echo "Pages build request failed (non-fatal)"

      - name: Wait for deployment and notify IndexNow
        if: steps.check.outputs.changed == 'true'
        run: |
          # Extract first story URL from index.html
          FIRST_STORY_URL=$(python3 -c "
          import re
          with open('index.html', 'r') as f:
              content = f.read()
              match = re.search(r'<!-- LATEST_STORIES_START -->.*?href=\"([^\"]+)\"', content, re.DOTALL)
              if match:
                  print(match.group(1))
          ")
          
          if [ -z "$FIRST_STORY_URL" ]; then
            echo "Could not extract first story URL, skipping wait"
            exit 0
          fi
          
          echo "Waiting for https://tde.arverma.dev/ to contain: $FIRST_STORY_URL"
          
          # Poll for up to 5 minutes (60 attempts, 5 seconds apart)
          for i in {1..60}; do
            if curl -sL https://tde.arverma.dev/ | grep -q "$FIRST_STORY_URL"; then
              echo "Deployment confirmed after $((i * 5)) seconds"
              break
            fi
            if [ $i -eq 60 ]; then
              echo "Timeout waiting for deployment (5 minutes), proceeding anyway"
            else
              sleep 5
            fi
          done
          
          # Notify IndexNow
          curl -X POST 'https://api.indexnow.org/indexnow' \
            -H 'Content-Type: application/json' \
            -d '{
              "host": "tde.arverma.dev",
              "key": "46ea86a7ca2b9ab5e74e4e8c96b04d10",
              "keyLocation": "https://tde.arverma.dev/46ea86a7ca2b9ab5e74e4e8c96b04d10.txt",
              "urlList": ["https://tde.arverma.dev/"]
            }' || echo "IndexNow notification failed (non-fatal)"
